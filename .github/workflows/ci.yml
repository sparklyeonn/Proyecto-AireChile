name: AireChile CI

on:
  push:
    branches:
      - feature/setup
      - develop
  pull_request:
    branches:
      - develop

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar importación de la API
        run: |
          python -c "from api.main import app; print('API importada correctamente')"

      - name: Ejecutar tests de API
        run: |
          python -m pytest tests/test_api.py -v

      - name: Ejecutar tests de configuración Docker
        run: |
          python -m pytest tests/test_docker_config.py -v

  docker-check:
    name: Docker validation
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Validar docker compose
        run: |
          docker compose config

      - name: Construir imagen Docker
        run: |
          docker build -t airechile-analytics .